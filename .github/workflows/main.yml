name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34"

      - name: Prepare Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build APK with compileSdk 34
        run: |
          sed -i 's/compileSdk[[:space:]]*=[[:space:]]*33/compileSdk = 34/g' app/build.gradle
          sed -i 's/compileSdk[[:space:]]*33/compileSdk 34/g' app/build.gradle
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Native-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
